[workspace]
members = ["crates/automation-client", "crates/protocol-core", "crates/server", "crates/store", "crates/local-files", "crates/identity"]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# Preserve binary64 values emitted by the Python authority across the gateway.
serde_json = { version = "1", features = ["float_roundtrip"] }
ts-rs = { version = "12", features = ["serde-json-impl"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
sha2 = "0.10"
base64 = "0.22"
thiserror = "2"
tempfile = "3"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
object_store = { version = "0.13", features = ["aws"] }
deadpool-postgres = "0.14"
