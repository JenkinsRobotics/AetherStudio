[package]
name = "aether-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "aether-server"

[dependencies]
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "ring", "rustls-native-certs"] }
zip = { version = "9.0.2", default-features = false }
futures-util = "0.3"
base64.workspace = true
aether-store = { path = "../store", version = "0.1.0-alpha.1" }
sha2.workspace = true
aether-identity = { path = "../identity", version = "0.1.0-alpha.1" }
deadpool-postgres.workspace = true
tokio-postgres.workspace = true
zeroize = { version = "1.8", features = ["serde"] }
aether-protocol-core = { path = "../protocol-core", version = "0.1.0-alpha.1" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }
axum.workspace = true
reqwest = { workspace = true, features = ["rustls-tls-native-roots"] }
getrandom = "0.4"
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs", "process"] }

[dev-dependencies]
tokio = { workspace = true, features = ["process"] }
tower = { version = "0.5", features = ["util"] }
